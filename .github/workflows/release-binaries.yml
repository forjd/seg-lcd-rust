name: Release Binaries

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            ext: ""
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            ext: ""
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin seg-lcd-rust --bin seg-lcd-rust-gui

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          package="seg-lcd-rust-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/seg-lcd-rust${{ matrix.ext }}" "dist/$package/"
          cp "target/${{ matrix.target }}/release/seg-lcd-rust-gui${{ matrix.ext }}" "dist/$package/"
          cp README.md LICENSE "dist/$package/"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "dist/$package.zip" "./dist/$package/*"
          else
            tar -czf "dist/$package.tar.gz" -C dist "$package"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
