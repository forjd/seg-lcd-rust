name: Release Binaries

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build assets for
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to build assets for
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            ext: ""
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            ext: ""
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" --bin seg-lcd-rust
          cargo build --release --locked --target "${{ matrix.target }}" --bin seg-lcd-rust-gui \
            || cargo build --release --locked --target "${{ matrix.target }}" --bin gui

      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          package="seg-lcd-rust-${RELEASE_TAG}-${{ matrix.name }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/seg-lcd-rust${{ matrix.ext }}" "dist/$package/"
          if [ -f "target/${{ matrix.target }}/release/seg-lcd-rust-gui${{ matrix.ext }}" ]; then
            cp "target/${{ matrix.target }}/release/seg-lcd-rust-gui${{ matrix.ext }}" "dist/$package/"
          else
            cp "target/${{ matrix.target }}/release/gui${{ matrix.ext }}" "dist/$package/seg-lcd-rust-gui${{ matrix.ext }}"
          fi
          cp README.md LICENSE "dist/$package/"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "dist/$package.zip" "./dist/$package/*"
          else
            tar -czf "dist/$package.tar.gz" -C dist "$package"
          fi

      - name: Smoke test archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          archive="$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | head -n 1)"
          if [[ "$archive" == *.zip ]]; then
            7z x "$archive" -osmoke
          else
            tar -xzf "$archive" -C smoke
          fi

          cli="$(find smoke -type f \( -name 'seg-lcd-rust' -o -name 'seg-lcd-rust.exe' \) | head -n 1)"
          gui="$(find smoke -type f \( -name 'seg-lcd-rust-gui' -o -name 'seg-lcd-rust-gui.exe' \) | head -n 1)"

          test -n "$cli"
          test -n "$gui"
          "$cli" --help
          "$cli" 12345

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip

  checksums:
    name: Generate checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download archive artifacts
        uses: actions/download-artifact@v4
        with:
          path: checksum-input
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd checksum-input
          sha256sum -- *.tar.gz *.zip > SHA256SUMS.txt

      - name: Upload checksum asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: checksum-input/SHA256SUMS.txt
