name: Release Binaries

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build assets for
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            ext: ""
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            ext: ""
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" --bin seg-lcd-rust
          cargo build --release --locked --target "${{ matrix.target }}" --bin seg-lcd-rust-gui \
            || cargo build --release --locked --target "${{ matrix.target }}" --bin gui

      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          package="seg-lcd-rust-${RELEASE_TAG}-${{ matrix.name }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/seg-lcd-rust${{ matrix.ext }}" "dist/$package/"
          if [ -f "target/${{ matrix.target }}/release/seg-lcd-rust-gui${{ matrix.ext }}" ]; then
            cp "target/${{ matrix.target }}/release/seg-lcd-rust-gui${{ matrix.ext }}" "dist/$package/"
          else
            cp "target/${{ matrix.target }}/release/gui${{ matrix.ext }}" "dist/$package/seg-lcd-rust-gui${{ matrix.ext }}"
          fi
          cp README.md LICENSE "dist/$package/"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "dist/$package.zip" "./dist/$package/*"
          else
            tar -czf "dist/$package.tar.gz" -C dist "$package"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
