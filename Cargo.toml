[package]
name = "seg-lcd-rust"
version = "0.6.0"
edition = "2024"
default-run = "seg-lcd-rust"
description = "A Rust seven-segment LCD simulator with terminal, SVG, and native GUI renderers."
license = "MIT"
repository = "https://github.com/Forjd/seg-lcd-rust"
readme = "README.md"
keywords = ["lcd", "seven-segment", "svg", "egui", "simulator"]
categories = ["command-line-utilities", "graphics", "gui"]

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.31"
tiny_http = "0.12"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[[bin]]
name = "seg-lcd-rust-gui"
path = "src/bin/gui.rs"

[[bin]]
name = "seg-lcd-rust-api"
path = "src/bin/api.rs"
